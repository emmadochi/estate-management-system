<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle grid texture -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>

  <!-- Building & House Modern Icon -->
  <g filter="url(#shadow)">
    <!-- Main Tower -->
    <rect x="230" y="160" width="130" height="230" rx="12" fill="#ffffff"/>
    
    <!-- Tower Windows -->
    <rect x="254" y="190" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="294" y="190" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="254" y="228" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="294" y="228" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="254" y="266" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="294" y="266" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="254" y="304" width="22" height="22" rx="4" fill="#2563eb"/>
    <rect x="294" y="304" width="22" height="22" rx="4" fill="#2563eb"/>

    <!-- Front House / Villa with Modern Roof -->
    <path d="M130 250 L220 180 L220 390 L130 390 Z" fill="#f8fafc"/>
    <path d="M118 252 L220 172 L230 180 L128 260 Z" fill="url(#roofGrad)"/>
    
    <!-- Front Villa Door & Window -->
    <rect x="155" y="310" width="36" height="80" rx="6" fill="#1e293b"/>
    <circle cx="182" cy="350" r="3" fill="#38bdf8"/>
    <rect x="155" y="260" width="36" height="32" rx="6" fill="#60a5fa"/>

    <!-- Security Shield / Verified Badge -->
    <g transform="translate(320, 310) scale(0.9)">
      <circle cx="45" cy="45" r="45" fill="#10b981"/>
      <path d="M30 45 L40 55 L60 35" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
